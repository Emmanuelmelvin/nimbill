name: CI

# Budgets (CI fails when a job goes over; see scripts/ci-budget.ts and the `timeout`s below):
#   waiting ≤ 5 s, setup ≤ 15 s, whole job ≤ 35 s,
#   lint ≤ 1 s, format ≤ 1 s, typecheck ≤ 5 s, tests ≤ 30 s.
# Lint, typecheck, tests and build run in parallel. The full suite runs on every push and in the
# merge queue; pull requests run only the tests their diff can reach once MERGE_QUEUE=on.

on:
  push:
    branches: [main, withdrawals]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  # A new commit on a PR cancels the run in progress. Runs on main finish, so they fill the caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, format and typecheck
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # A plain install: restoring a cached node_modules took 5–7 s on GitHub's runners, no faster than this.
      - run: bun install --frozen-lockfile
      # Each check runs even when one before it failed, so one run lists every failure.
      - name: Lint
        if: success() || failure()
        run: timeout 1s bun lint
      - name: Format
        if: success() || failure()
        run: timeout 1s bun fmt --check
      - name: Typecheck
        if: success() || failure()
        run: timeout 5s sh -c 'bunx next typegen && bun check'

  tests:
    name: Tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The MCP server under test runs on Node, as published: the runner's own Node 24 (the step below
      # prints it), so no setup-node.
      - run: node --version
      # A plain install: restoring a cached node_modules took 5–7 s on GitHub's runners, no faster than this.
      - run: bun install --frozen-lockfile
      # In-memory databases, no dev server, no secrets. Random order, one worker per core.
      - name: Tests
        run: timeout 30s bun scripts/ci-test.ts
        env:
          MERGE_QUEUE: ${{ vars.MERGE_QUEUE }}

  build:
    name: Build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # A plain install: restoring a cached node_modules took 5–7 s on GitHub's runners, no faster than this.
      - run: bun install --frozen-lockfile
      # Turbopack keeps its build work in .next/cache. Every run starts from the latest saved copy;
      # only pushes save a new one.
      - uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      # Every env var is optional, so the build runs without production secrets. The Typecheck
      # step above runs the same type check, so the build skips its own copy (Vercel still runs it).
      # next build runs on the Node the runner already has (Next 16 needs 20.9 or newer).
      - run: node --version && bun run build
        env:
          NIMBILL_CI_TYPECHECKED: 1
      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}

  budgets:
    name: Budgets
    needs: [checks, tests, build]
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun scripts/ci-budget.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Off: waiting and setup over budget only warn. Turn on once CI runs on warm machines.
          ENFORCE_SETUP_BUDGETS: ${{ vars.ENFORCE_SETUP_BUDGETS }}

  # The one check to require in branch protection and the merge queue.
  ci:
    name: CI
    needs: [checks, tests, build, budgets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every job passed and stayed in budget."
