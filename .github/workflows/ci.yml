name: CI

on:
  push:
    branches: [main, withdrawals]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The test scripts and the app still run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # node_modules itself is cached, keyed on the lockfile. Pushes to main fill it; PRs read main's copy.
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint
      - name: Format
        run: bun fmt --check
      - name: Typecheck
        run: bunx next typegen && bun check

      # Every file in tests/: in-memory databases, no dev server, no secrets. Random order, one worker per core.
      - name: Tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      # Every env var is optional, so the build runs without production secrets.
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
