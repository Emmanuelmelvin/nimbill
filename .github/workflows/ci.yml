name: CI

on:
  push:
    branches: [main, withdrawals]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The test scripts and the app still run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # node_modules itself is cached, keyed on the lockfile. Pushes to main fill it; PRs read main's copy.
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint
      - name: Format
        run: bun fmt --check
      - name: Typecheck
        run: bunx next typegen && bunx tsc --noEmit

      # None of these need a database, a dev server or any secrets.
      - run: bun run test:address
      - run: bun run test:tags
      - run: bun run test:earnings
      - run: bun run test:webhooks
      - run: bun run test:webhook-health
      - run: bun run test:webhook-events
      - run: bun run test:recurring
      - run: bun run test:recurring-lifecycle
      - run: bun run test:receipt-email
      - run: bun run test:withdraw
      - run: bun run test:withdraw-status
      - run: bun run test:mcp

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      # Every env var is optional, so the build runs without production secrets.
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
